openapi: 3.1.0
info:
  title: Unity & Spatial SDK API
  description: |
    This API allows developers to integrate Unity's CI/CD capabilities and Spatial's Unity SDK for developing, building, and deploying 3D, VR, and AR environments. Enhanced with job tracking, asset management, multi-user collaboration, and environment versioning.
  version: 1.1.0
servers:
  - url: https://api.unity-spatial.com/v1
    description: Main API server for Unity and Spatial environments

paths:
  # ------------------ Unity GitHub Actions ------------------
  /unity/build:
    post:
      operationId: buildUnityProject
      summary: Build Unity Project
      description: |
        Triggers a CI/CD pipeline to build a Unity project targeting platforms such as WebGL, Windows, macOS, or Android. Allows for additional configuration like build parameters and flags.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetPlatform:
                  type: string
                  description: Target platform for the build (e.g., WebGL, Windows, macOS, Android).
                projectPath:
                  type: string
                  description: Path to the Unity project.
                buildParameters:
                  type: object
                  description: Additional build parameters like `debug` mode or `release`.
      responses:
        '200':
          description: Build initiated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  buildId:
                    type: string
                    description: The ID of the build initiated.
                  statusUrl:
                    type: string
                    description: URL to track the status of the build.

  /unity/build/status/{buildId}:
    get:
      operationId: getBuildStatus
      summary: Get Build Status
      description: Retrieves the status of a specific Unity build.
      parameters:
        - name: buildId
          in: path
          required: true
          schema:
            type: string
            description: The unique ID of the build to check the status.
      responses:
        '200':
          description: Build status retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  buildId:
                    type: string
                  status:
                    type: string
                    description: The current status of the build (e.g., running, completed, failed).
                  progress:
                    type: number
                    description: Build progress as a percentage.

  /unity/test:
    post:
      operationId: testUnityProject
      summary: Run Unity Tests
      description: |
        Runs unit tests in a Unity project as part of the CI pipeline. Supports both **edit mode** and **play mode** tests. Allows for filtering tests and specifying custom configurations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                testMode:
                  type: string
                  description: Mode of the test (edit mode or play mode).
                projectPath:
                  type: string
                  description: Path to the Unity project.
                testFilter:
                  type: string
                  description: Filter specific tests to run (e.g., `namespace.class.method`).
                config:
                  type: object
                  description: Additional configurations like test timeout or retries.
      responses:
        '200':
          description: Test suite initiated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  testId:
                    type: string
                    description: The ID of the test run.
                  statusUrl:
                    type: string
                    description: URL to track the status of the test.

  /unity/deploy:
    post:
      operationId: deployUnityProject
      summary: Deploy Unity Build
      description: |
        Deploys the built Unity project to a specific target environment (e.g., Web, Steam, or Spatial). Includes options for multi-version deployment and rollback capabilities.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                environment:
                  type: string
                  description: The target environment for deployment (e.g., WebGL, Spatial).
                buildId:
                  type: string
                  description: The ID of the build to deploy.
                versioning:
                  type: boolean
                  description: Set true to version the deployment for future rollback.
      responses:
        '200':
          description: Deployment initiated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deploymentId:
                    type: string
                    description: The ID of the deployment.
                  statusUrl:
                    type: string
                    description: URL to track deployment status.

  # ------------------ Spatialsys Unity SDK ------------------
  /spatial/environment:
    post:
      operationId: createSpatialEnvironment
      summary: Create Spatial Environment
      description: |
        Creates a new 3D environment in Spatial using the Spatial Unity SDK. The environment can be configured for VR, AR, or desktop experiences. Allows collaborative editing and versioning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                environmentName:
                  type: string
                  description: The name of the new environment.
                templateId:
                  type: string
                  description: The ID of a template to use for the environment.
                multiUserEdit:
                  type: boolean
                  description: Set true to enable collaborative editing.
                versionControl:
                  type: boolean
                  description: Enable version control for future rollbacks.
      responses:
        '201':
          description: Environment created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  environmentId:
                    type: string
                    description: The ID of the created environment.
                  editUrl:
                    type: string
                    description: URL to start collaborative editing.

  /spatial/environment/{environmentId}/status:
    get:
      operationId: getSpatialEnvironmentStatus
      summary: Get Environment Status
      description: Fetches the status of a Spatial environment including edit status, number of active users, and deployment state.
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            description: The ID of the environment to retrieve status for.
      responses:
        '200':
          description: Environment status retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  environmentId:
                    type: string
                  status:
                    type: string
                    description: Current status of the environment (e.g., active, archived).
                  activeUsers:
                    type: integer
                    description: Number of users currently editing the environment.
                  lastDeployment:
                    type: string
                    description: Timestamp of the last deployment.

  /spatial/assets/upload:
    post:
      operationId: uploadSpatialAssets
      summary: Upload Assets to Spatial
      description: |
        Uploads assets (e.g., textures, 3D models, sounds) to a Spatial environment for use in 3D spaces. Allows for batch uploading and optional asset compression.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                environmentId:
                  type: string
                  description: The ID of the environment to upload assets to.
                assetFiles:
                  type: array
                  items:
                    type: string
                    format: binary
                    description: List of files to upload as assets.
                compress:
                  type: boolean
                  description: Set true to compress assets before upload.
      responses:
        '200':
          description: Assets uploaded successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assetIds:
                    type: array
                    items:
                      type: string
                    description: List of uploaded asset IDs.

  /spatial/environment/{environmentId}/deploy:
    post:
      operationId: deploySpatialEnvironment
      summary: Deploy Spatial Environment
      description: |
        Deploys the environment created in Spatial so users can access and explore it on different platforms like VR, Web, or Mobile. Includes versioning and rollback support.
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            description: The ID of the environment to deploy.
      responses:
        '200':
          description: Environment deployed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deploymentId:
                    type: string
                    description: The ID of the deployment.
                  statusUrl:
                    type: string
                    description: URL to track deployment status.
paths:
  /spatial/avatar/create:
    post:
      operationId: createAvatar
      summary: Create Avatar for Spatial Environment
      description: |
        Creates a new avatar for use in Spatial environments, enabling users to interact with others in VR/AR spaces. Supports avatar customization, including body structure, clothing, and accessories.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                avatarName:
                  type: string
                  description: The name of the avatar.
                avatarFile:
                  type: string
                  format: binary
                  description: Avatar model file (e.g., FBX, GLTF).
                customizationOptions:
                  type: object
                  description: Customization options like body size, clothing, and accessories.
      responses:
        '201':
          description: Avatar created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarId:
                    type: string
                    description: The ID of the created avatar.

  /spatial/avatar/update/{avatarId}:
    patch:
      operationId: updateAvatar
      summary: Update Avatar Customization
      description: |
        Update the customization of an existing avatar in Spatial, such as changing clothing, adding accessories, or updating avatar animations.
      parameters:
        - name: avatarId
          in: path
          required: true
          schema:
            type: string
            description: The ID of the avatar to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customizationOptions:
                  type: object
                  description: Customization options such as clothing, accessories, and animations.
      responses:
        '200':
          description: Avatar updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarId:
                    type: string
                    description: The ID of the updated avatar.

  /spatial/environment/{environmentId}/version:
    post:
      operationId: createEnvironmentVersion
      summary: Create a Version Snapshot of the Environment
      description: |
        Creates a version snapshot of the current state of a Spatial environment, allowing rollback and historical tracking of changes. Supports saving multiple versions for collaborative environments.
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            description: The ID of the environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                versionName:
                  type: string
                  description: A custom name for the version snapshot.
                description:
                  type: string
                  description: Optional description of the changes in this version.
      responses:
        '201':
          description: Version snapshot created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  versionId:
                    type: string
                    description: The ID of the created version.

  /spatial/environment/{environmentId}/versions:
    get:
      operationId: listEnvironmentVersions
      summary: List Versions of a Spatial Environment
      description: |
        Retrieves a list of all version snapshots of the specified Spatial environment, allowing users to browse and select specific versions for rollback or comparison.
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            description: The ID of the environment to list versions for.
      responses:
        '200':
          description: Versions retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        versionId:
                          type: string
                        versionName:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
                          description: Time when the version was created.
                        description:
                          type: string
                          description: Additional information about the changes in the version.

  /spatial/environment/{environmentId}/rollback:
    post:
      operationId: rollbackEnvironment
      summary: Rollback to a Previous Version
      description: |
        Allows rolling back the current Spatial environment to a previously saved version snapshot. The rollback action can be tracked, and the changes will be versioned.
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            description: The ID of the environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                versionId:
                  type: string
                  description: The ID of the version to rollback to.
      responses:
        '200':
          description: Rollback initiated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rollbackId:
                    type: string
                    description: The ID of the rollback process.

  /unity/build/{buildId}/rollback:
    post:
      operationId: rollbackUnityBuild
      summary: Rollback a Unity Build Deployment
      description: |
        Initiates a rollback of a Unity build to a previous successful deployment. This is useful for handling faulty updates or reverting to a stable version.
      parameters:
        - name: buildId
          in: path
          required: true
          schema:
            type: string
            description: The ID of the build to rollback from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                previousBuildId:
                  type: string
                  description: The ID of the previous successful build to rollback to.
      responses:
        '200':
          description: Rollback initiated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rollbackId:
                    type: string
                    description: The ID of the rollback process.
