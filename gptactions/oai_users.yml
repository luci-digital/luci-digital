openapi: 3.1.0
info:
  title: Lucia's Proton and Hedera Integration
  description: |
    This API integrates Proton services (Mail, Drive, VPN, Pass) with Hedera for decentralized identity and secure transactions. GPT actions can manage emails, files, passwords, VPN, and secure blockchain-based tasks like payments and identity verification.
  version: 1.0.0
servers:
  - url: https://api.luci-digital.com/v1
    description: Main Production Server


paths:
  /users/create:
    post:
      operationId: createUser
      summary: Create a new user account.
      description: Registers a new user in the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Desired username.
                password:
                  type: string
                  description: Desired password.
                email:
                  type: string
                  description: User email address.
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    description: The unique ID of the newly created user.
