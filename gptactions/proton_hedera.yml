openapi: 3.1.0
info:
  title: Lucia's Proton and Hedera Integration
  description: |
    This API integrates Proton services (Mail, Drive, VPN, Pass) with Hedera for decentralized identity and secure transactions. GPT actions can manage emails, files, passwords, VPN, and secure blockchain-based tasks like payments and identity verification.
  version: 1.0.0
servers:
  - url: https://api.luci-digital.com/v1
    description: Main Production Server

paths:
  # ProtonMail Actions
  /protonmail/send:
    post:
      operationId: sendEmail
      summary: Send an email via ProtonMail
      description: Sends an encrypted email using ProtonMail via Lucia's GPT actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailRequest'
      responses:
        '200':
          description: Email sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailResponse'

  /protonmail/inbox:
    get:
      operationId: getInbox
      summary: Retrieve emails from ProtonMail inbox
      description: Retrieves the latest emails from a ProtonMail inbox, processed by GPT actions.
      responses:
        '200':
          description: Inbox emails retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxEmailsResponse'

  # ProtonDrive Actions
  /protondrive/upload:
    post:
      operationId: uploadFile
      summary: Upload a file to ProtonDrive
      description: Uploads a file to ProtonDrive for secure storage, integrated with Hedera for ownership validation.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFileRequest'
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFileResponse'

  /protondrive/download/{fileId}:
    get:
      operationId: downloadFile
      summary: Download a file from ProtonDrive
      description: Downloads a file from ProtonDrive using a secure connection.
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
          description: ID of the file to download
      responses:
        '200':
          description: File downloaded successfully
          content:
            application/octet-stream

  /protondrive/files:
    get:
      operationId: listFiles
      summary: List files stored in ProtonDrive
      description: Retrieves a list of files from ProtonDrive for the given user.
      responses:
        '200':
          description: List of files retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListResponse'

  # ProtonVPN Actions
  /protonvpn/connect:
    post:
      operationId: connectToVPN
      summary: Connect to ProtonVPN
      description: Connects to a ProtonVPN server using GPT actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectVPNRequest'
      responses:
        '200':
          description: VPN connected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectVPNResponse'

  /protonvpn/disconnect:
    post:
      operationId: disconnectFromVPN
      summary: Disconnect from ProtonVPN
      description: Disconnects the current VPN session using ProtonVPN.
      responses:
        '200':
          description: VPN disconnected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisconnectVPNResponse'

  # ProtonPass Actions
  /protonpass/save:
    post:
      operationId: savePassword
      summary: Save a password in ProtonPass
      description: Saves a password securely using ProtonPass.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePasswordRequest'
      responses:
        '200':
          description: Password saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavePasswordResponse'

  /protonpass/list:
    get:
      operationId: listPasswords
      summary: List saved passwords
      description: Lists all saved passwords stored in ProtonPass.
      responses:
        '200':
          description: Passwords retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPasswordsResponse'

  # Hedera Integration: Decentralized Identity
  /hedera/identity/create:
    post:
      operationId: createHederaAccount
      summary: Create a Hedera account for decentralized identity
      description: Creates a new decentralized identity using Hedera and links it with ProtonMail or ProtonPass for secure verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHederaAccountRequest'
      responses:
        '201':
          description: Hedera account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateHederaAccountResponse'

  /hedera/identity/verify:
    post:
      operationId: verifyHederaIdentity
      summary: Verify user identity via Hedera
      description: Verifies a user’s identity by querying the Hedera blockchain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyHederaIdentityRequest'
      responses:
        '200':
          description: Identity verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyHederaIdentityResponse'

  # Hedera Integration: Payments
  /hedera/transactions/send:
    post:
      operationId: sendHederaPayment
      summary: Send HBAR payment via Hedera
      description: Executes an HBAR transaction between two Hedera accounts for Proton-related services or other blockchain transactions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendHederaPaymentRequest'
      responses:
        '200':
          description: Payment transaction successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendHederaPaymentResponse'

  /hedera/transactions/status:
    get:
      operationId: getTransactionStatus
      summary: Get the status of a Hedera transaction
      description: Retrieves the status of a Hedera transaction, such as a payment or identity verification.
      parameters:
        - name: transactionId
          in: query
          required: true
          schema:
            type: string
          description: Transaction ID to query
      responses:
        '200':
          description: Transaction status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionStatusResponse'

components:
  schemas:
    SendEmailRequest:
      type: object
      properties:
        to:
          type: string
          description: Recipient email address
        subject:
          type: string
          description: Email subject
        body:
          type: string
          description: Email body content
        attachments:
          type: array
          items:
            type: string
            format: binary
            description: File attachments (optional)
      required:
        - to
        - subject
        - body

    SendEmailResponse:
      type: object
      properties:
        status:
          type: string
          description: Status of the email delivery

    InboxEmailsResponse:
      type: object
      properties:
        emails:
          type: array
          items:
            type: object
            properties:
              sender:
                type: string
                description: Sender's email address
              subject:
                type: string
                description: Email subject
              receivedAt:
                type: string
                format: date-time
                description: Time email was received

    UploadFileRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: File to upload
      required:
        - file

    UploadFileResponse:
      type: object
      properties:
        fileId:
          type: string
          description: ID of the uploaded file

    FileListResponse:
      type: object
      properties:
        files:
          type: array
          items:
            type: object
            properties:
              fileId:
                type: string
                description: ID of the file
              fileName:
                type: string
                description: Name of the file

    ConnectVPNRequest:
      type: object
      properties:
        serverId:
          type: string
          description: VPN server to connect to
      required:
        - serverId

    ConnectVPNResponse:
      type: object
      properties:
        status:
          type: string
          description: Status of the VPN connection

    DisconnectVPNResponse:
      type: object
      properties:
        status:
          type: string
          description: Status of the VPN disconnection

    SavePasswordRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the password entry (e.g., "ProtonMail Account")
        username:
          type: string
          description: Username for the account
        password:
          type: string
          description: The actual password to be saved
        url:
          type: string
          description: URL of the service (optional)
      required:
        - name
        - username
        - password

    SavePasswordResponse:
      type: object
      properties:
        status:
          type: string
          description: Status of the password save operation

    ListPasswordsResponse:
      type: object
      properties:
        passwords:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Name or label of the password entry
              username:
                type: string
                description: Username associated with the password
              url:
                type: string
                description: URL of the service or website (optional)

    CreateHederaAccountRequest:
      type: object
      properties:
        userId:
          type: string
          description: User ID within the Lucia system
        initialBalance:
          type: number
          description: Initial balance of the Hedera account in HBAR (default: 0 HBAR)
      required:
        - userId

    CreateHederaAccountResponse:
      type: object
      properties:
        accountId:
          type: string
          description: The Hedera account ID created for the user
        balance:
          type: number
          description: Initial balance of the account in HBAR

    VerifyHederaIdentityRequest:
      type: object
      properties:
        userId:
          type: string
          description: ID of the user whose identity is being verified
        idHash:
          type: string
          description: The hashed identity credentials
      required:
        - userId
        - idHash

    VerifyHederaIdentityResponse:
      type: object
      properties:
        isVerified:
          type: boolean
          description: True if the identity verification was successful

    SendHederaPaymentRequest:
      type: object
      properties:
        senderAccountId:
          type: string
          description: The Hedera account ID of the sender
        receiverAccountId:
          type: string
          description: The Hedera account ID of the receiver
        amount:
          type: number
          description: Amount of HBAR to transfer
      required:
        - senderAccountId
        - receiverAccountId
        - amount

    SendHederaPaymentResponse:
      type: object
      properties:
        transactionId:
          type: string
          description: The ID of the transaction on Hedera

    TransactionStatusResponse:
      type: object
      properties:
        transactionId:
          type: string
          description: ID of the transaction
        status:
          type: string
          description: Status of the transaction (e.g., "pending", "completed", "failed")