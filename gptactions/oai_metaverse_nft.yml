openapi: 3.1.0
info:
  title: Lucia's Proton and Hedera Integration
  description: |
    This API integrates Proton services (Mail, Drive, VPN, Pass) with Hedera for decentralized identity and secure transactions. GPT actions can manage emails, files, passwords, VPN, and secure blockchain-based tasks like payments and identity verification.
  version: 1.0.0
servers:
  - url: https://api.luci-digital.com/v1
    description: Main Production Server


/metaverse/space/create:
    post:
      operationId: create3DSpace
      summary: Create a new 3D space in the metaverse using Spatial.io
      description: |
        This endpoint sets up a 3D virtual environment for collaboration, meetings, or interactive experiences via Spatial.io.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spaceName:
                  type: string
                  description: The name of the 3D space to be created
                environmentType:
                  type: string
                  description: The type of environment (e.g., "virtual office", "workshop")
                avatarsEnabled:
                  type: boolean
                  description: Whether avatars are enabled in the space
                accessControl:
                  type: string
                  description: Access control level (e.g., "public", "private", "invite-only")
      responses:
        '201':
          description: 3D space created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  spaceId:
                    type: string
                    description: The unique ID of the created space

  /alerts/subscribe:
    post:
      operationId: subscribeToAlerts
      summary: Subscribe to system alerts
      description: |
        Subscribes to real-time alerts for important system events, such as transaction statuses, IoT device changes, and identity verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alertType:
                  type: string
                  description: The type of alert to subscribe to (e.g., "transaction", "identity", "device status")
                userId:
                  type: string
                  description: The ID of the user subscribing to alerts
      responses:
        '200':
          description: Subscribed to alerts successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptionId:
                    type: string
                    description: Unique ID for the subscription
                  success:
                    type: boolean
                    description: Whether the subscription was successful

  /alerts/event:
    post:
      operationId: triggerEventAlert
      summary: Trigger an alert for an event
      description: |
        Sends an alert notification to Daryl or other authorized users for events like completed transactions, IoT failures, or identity verification issues.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventType:
                  type: string
                  description: The type of event (e.g., "transactionCompleted", "iotFailure", "identityVerified")
                message:
                  type: string
                  description: Detailed message describing the event
                userId:
                  type: string
                  description: ID of the user or system associated with the event
                timestamp:
                  type: string
                  format: date-time
                  description: Timestamp of when the event occurred
      responses:
        '200':
          description: Event alert triggered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the event alert was successfully processed

  /nft/mint:
    post:
      operationId: mintNFT
      summary: Mint an NFT for content ownership
      description: |
        Mints a new NFT based on user-generated content or digital assets, allowing users to maintain ownership and control over their creations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The ID of the user minting the NFT
                contentUrl:
                  type: string
                  description: The URL of the digital content for which the NFT is being minted
                metadata:
                  type: object
                  description: Additional metadata associated with the NFT
                  properties:
                    title:
                      type: string
                      description: The title of the content
                    description:
                      type: string
                      description: Description of the content being minted as an NFT
                    attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          traitType:
                            type: string
                            description: The trait type (e.g., "color", "size")
                          value:
                            type: string
                            description: The value of the trait
      responses:
        '201':
          description: NFT minted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  nftId:
                    type: string
                    description: The unique ID of the minted NFT
                  tokenUrl:
                    type: string
                    description: The tokenized URL of the NFT on the blockchain

  /nft/transfer:
    post:
      operationId: transferNFT
      summary: Transfer ownership of an NFT
      description: |
        Transfers ownership of an NFT from one user to another.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nftId:
                  type: string
                  description: The unique ID of the NFT to be transferred
                fromUserId:
                  type: string
                  description: The current owner's user ID
                toUserId:
                  type: string
                  description: The recipient's user ID
                transactionMemo:
                  type: string
                  description: Optional memo for the transfer
      responses:
        '200':
          description: NFT transferred successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the NFT was transferred successfully
                  transactionId:
                    type: string
                    description: ID of the transaction for tracking

  /transaction/status:
    get:
      operationId: getTransactionStatus
      summary: Retrieve the status of a transaction
      description: |
        Queries the blockchain to retrieve the current status of a transaction, such as an HBAR payment or NFT transfer.
      parameters:
        - name: transactionId
          in: query
          required: true
          schema:
            type: string
            description: The ID of the transaction to query
      responses:
        '200':
          description: Transaction status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The current status of the transaction (e.g., "pending", "completed", "failed")
                  timestamp:
                    type: string
                    format: date-time
                    description: The timestamp of the transaction status check
                  blockNumber:
                    type: string
                    description: The block number in which the transaction was confirmed