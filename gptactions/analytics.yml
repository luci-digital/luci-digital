paths:
  /analytics/metrics:
    get:
      operationId: getSystemMetrics
      summary: Fetch system performance metrics.
      description: Retrieves system metrics such as CPU usage, memory consumption, and network traffic, typically monitored by tools like Prometheus.
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  cpuUsage:
                    type: number
                    description: Percentage of CPU usage.
                  memoryUsage:
                    type: number
                    description: Memory consumption in MB.
                  networkTraffic:
                    type: number
                    description: Network traffic in Mbps.

  /analytics/alerts:
    get:
      operationId: getAlerts
      summary: Get system alerts.
      description: Retrieves alerts based on system monitoring tools (e.g., Prometheus, Grafana) to notify users of any performance issues or anomalies.
      responses:
        '200':
          description: Alerts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: string
                          description: When the alert was triggered.
                        message:
                          type: string
                          description: The content of the alert.
                        severity:
                          type: string
                          description: Severity level of the alert (e.g., warning, critical).

  /analytics/logs:
    get:
      operationId: getSystemLogs
      summary: Fetch system logs for analysis.
      description: Retrieves logs from system components (e.g., services, servers) for performance analysis or troubleshooting.
      responses:
        '200':
          description: Logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: string
                          description: Time the log entry was created.
                        service:
                          type: string
                          description: The service or component that generated the log.
                        message:
                          type: string
                          description: The log message.
