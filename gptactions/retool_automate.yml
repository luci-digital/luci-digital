openapi: 3.1.0
info:
  title: Retool Integration API for Lucia
  description: |
    This API allows Lucia to build web and mobile apps, automate tasks, and integrate AI within Retool's environment.
  version: 1.0.0
servers:
  - url: https://api.retool.com/v1
    description: Retool API Server

paths:
  /apps:
    get:
      operationId: getAllApps
      summary: Retrieve all available Retool apps
      description: |
        Fetches a list of all the apps available in Retool, allowing Lucia to interact with existing apps and manage them.
      responses:
        '200':
          description: List of Retool apps
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    appId:
                      type: string
                      description: Unique ID of the app
                    name:
                      type: string
                      description: Name of the app
                    status:
                      type: string
                      description: Status of the app (e.g., Active, Archived)

  /apps/{appId}:
    get:
      operationId: getAppById
      summary: Retrieve specific Retool app by ID
      description: |
        Fetches details of a specific Retool app by providing its unique ID.
      parameters:
        - name: appId
          in: path
          required: true
          description: The unique ID of the app
          schema:
            type: string
      responses:
        '200':
          description: Details of the Retool app
          content:
            application/json:
              schema:
                type: object
                properties:
                  appId:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  queries:
                    type: array
                    items:
                      type: string
                      description: List of queries used in the app

  /apps:
    post:
      operationId: createNewApp
      summary: Create a new Retool app
      description: |
        Creates a new app in Retool by defining the layout, queries, and UI components.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the new app
                layout:
                  type: object
                  description: Layout configuration for the app's user interface
                queries:
                  type: array
                  items:
                    type: string
                    description: Predefined queries that the app will use
      responses:
        '201':
          description: Retool app created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  appId:
                    type: string
                    description: The unique ID of the created app
                  name:
                    type: string
                    description: The name of the app

  /queries:
    get:
      operationId: getAllQueries
      summary: Fetch all queries in Retool
      description: Retrieves all queries available in the Retool workspace.
      responses:
        '200':
          description: A list of queries in Retool
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    queryId:
                      type: string
                      description: Unique ID of the query
                    name:
                      type: string
                      description: Name of the query
                    dataSource:
                      type: string
                      description: Data source being queried
                    queryText:
                      type: string
                      description: The actual query (SQL, NoSQL, or API call)
                    createdAt:
                      type: string
                      format: date-time

  /queries/{queryId}:
    get:
      operationId: getQueryById
      summary: Retrieve details of a specific query
      description: Fetches the query details based on its unique ID.
      parameters:
        - name: queryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Query details
          content:
            application/json:
              schema:
                type: object
                properties:
                  queryId:
                    type: string
                  name:
                    type: string
                  dataSource:
                    type: string
                  queryText:
                    type: string
                  createdAt:
                    type: string
                    format: date-time

  /queries:
    post:
      operationId: createNewQuery
      summary: Create a new query in Retool
      description: |
        Allows Lucia to create a new query in Retool, which can be linked to an app or used for automation tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the query
                dataSource:
                  type: string
                  description: The data source being queried
                queryText:
                  type: string
                  description: The SQL, NoSQL, or API request that defines the query
      responses:
        '201':
          description: Query created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  queryId:
                    type: string
                    description: The unique ID of the created query

  /tasks/automate:
    post:
      operationId: automateTask
      summary: Automate tasks using Retool
      description: |
        Automates complex tasks in Retool by defining a workflow of connected apps, queries, and external APIs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskName:
                  type: string
                  description: The name of the task to automate
                workflow:
                  type: array
                  items:
                    type: object
                    properties:
                      step:
                        type: string
                        description: Name of the step in the workflow
                      action:
                        type: string
                        description: Action to take (e.g., run query, call API, send email)
      responses:
        '201':
          description: Task automation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId:
                    type: string
                    description: The unique ID of the automated task