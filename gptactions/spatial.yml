openapi: 3.1.0
info:
  title: Lucia Digital API
  description: |
    This API integrates various components of the Lucia Digital platform, including Spatial.io for immersive virtual reality experiences, Wolfram Alpha for computational intelligence, digital marketing tools, WordPress optimization, media content management, social media scheduling, and enhanced AI capabilities using OpenAI's libraries.
  version: 1.8.0
servers:
  - url: https://api.luci-digital.com/v1
    description: Main Production Server
  - url: https://staging.luci-digital.com
    description: Staging Server

paths:
  /spatial/virtual-spaces:
    get:
      operationId: listVirtualSpaces
      summary: List available virtual spaces
      description: Retrieves a list of virtual spaces accessible to the user.
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
          description: The user's ID
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: Number of items per page
      responses:
        '200':
          description: List of virtual spaces retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualSpaceListResponse'
        '400':
          description: Bad request (e.g., missing userId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spatial/virtual-space:
    post:
      operationId: createVirtualSpace
      summary: Create a new virtual space
      description: Creates a new virtual space for meetings, events, or collaborative projects using Spatial.io.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualSpaceRequest'
      responses:
        '201':
          description: Virtual space created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVirtualSpaceResponse'
        '400':
          description: Bad request (e.g., missing required parameters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spatial/virtual-space/{spaceId}:
    get:
      operationId: getVirtualSpaceDetails
      summary: Get details of a virtual space
      description: Retrieves detailed information about a specific virtual space.
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the virtual space
      responses:
        '200':
          description: Virtual space details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualSpace'
        '404':
          description: Virtual space not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      operationId: deleteVirtualSpace
      summary: Delete a virtual space
      description: Deletes a virtual space and all associated data.
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the virtual space
      responses:
        '204':
          description: Virtual space deleted successfully
        '404':
          description: Virtual space not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spatial/virtual-space/{spaceId}/invite:
    post:
      operationId: inviteUsersToSpace
      summary: Invite users to a virtual space
      description: Sends invitations to users to join a specific virtual space in Spatial.io.
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the virtual space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUsersRequest'
      responses:
        '200':
          description: Users invited successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteUsersResponse'
        '400':
          description: Bad request (e.g., invalid space ID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spatial/virtual-space/{spaceId}/participants:
    get:
      operationId: listSpaceParticipants
      summary: List participants in a virtual space
      description: Retrieves a list of participants in a specific virtual space.
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the virtual space
      responses:
        '200':
          description: Participants retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantsListResponse'
        '400':
          description: Bad request (e.g., invalid space ID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spatial/virtual-space/{spaceId}/3d-model:
    post:
      operationId: upload3DModel
      summary: Upload a 3D model to a virtual space
      description: Uploads a 3D model to a virtual space for display or interaction.
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the virtual space
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Upload3DModelRequest'
      responses:
        '200':
          description: 3D model uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload3DModelResponse'
        '400':
          description: Bad request (e.g., invalid file format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      operationId: list3DModels
      summary: List 3D models in a virtual space
      description: Retrieves a list of 3D models available in the virtual space.
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the virtual space
      responses:
        '200':
          description: 3D models retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
        '400':
          description: Bad request (e.g., invalid space ID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spatial/virtual-space/{spaceId}/3d-model/{modelId}:
    delete:
      operationId: delete3DModel
      summary: Delete a 3D model from a virtual space
      description: Deletes a specific 3D model from the virtual space.
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the virtual space
        - name: modelId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the 3D model
      responses:
        '204':
          description: 3D model deleted successfully
        '404':
          description: 3D model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spatial/virtual-space/{spaceId}/event:
    post:
      operationId: scheduleVirtualEvent
      summary: Schedule an event in a virtual space
      description: Schedules an event in a virtual space with specified details.
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the virtual space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleEventRequest'
      responses:
        '201':
          description: Event scheduled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleEventResponse'
        '400':
          description: Bad request (e.g., missing required parameters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      operationId: listVirtualEvents
      summary: List events in a virtual space
      description: Retrieves a list of events scheduled in the virtual space.
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the virtual space
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          description: Bad request (e.g., invalid space ID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spatial/avatar/customize:
    post:
      operationId: customizeAvatar
      summary: Customize user's virtual avatar
      description: Allows a user to customize their virtual avatar's appearance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomizeAvatarRequest'
      responses:
        '200':
          description: Avatar customized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomizeAvatarResponse'
        '400':
          description: Bad request (e.g., invalid settings)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    VirtualSpaceListResponse:
      type: object
      properties:
        spaces:
          type: array
          items:
            $ref: '#/components/schemas/VirtualSpace'
        pagination:
          $ref: '#/components/schemas/Pagination'

    VirtualSpace:
      type: object
      properties:
        spaceId:
          type: string
          description: The ID of the virtual space
        spaceName:
          type: string
          description: The name of the virtual space
        createdAt:
          type: string
          format: date-time
          description: Creation date of the space
        ownerId:
          type: string
          description: User ID of the space owner
        templateId:
          type: string
          description: The ID of the template used to create the space (if any)
        description:
          type: string
          description: Description of the virtual space
        settings:
          type: object
          description: Additional settings for the space

    CreateVirtualSpaceRequest:
      type: object
      properties:
        userId:
          type: string
          description: The user's ID
        spaceName:
          type: string
          description: The name of the virtual space
        templateId:
          type: string
          description: The ID of a template to base the space on (optional)
        description:
          type: string
          description: Description of the virtual space (optional)
        settings:
          type: object
          description: Additional settings for the space (optional)
      required:
        - userId
        - spaceName

    CreateVirtualSpaceResponse:
      type: object
      properties:
        spaceId:
          type: string
          description: The ID of the newly created virtual space
        status:
          type: string
          description: Status of the space creation

    InviteUsersRequest:
      type: object
      properties:
        userEmails:
          type: array
          items:
            type: string
            format: email
          description: Email addresses of users to invite
        message:
          type: string
          description: Custom message to include in the invitation (optional)
      required:
        - userEmails

    InviteUsersResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the invitations were sent successfully
        invitedUsers:
          type: array
          items:
            type: string
          description: List of emails that were successfully invited
        failedInvites:
          type: array
          items:
            type: string
          description: List of emails where the invitation failed

    ParticipantsListResponse:
      type: object
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
      required:
        - participants

    Participant:
      type: object
      properties:
        userId:
          type: string
          description: User ID of the participant
        displayName:
          type: string
          description: Display name of the participant
        avatarUrl:
          type: string
          format: uri
          description: URL to the participant's avatar image

    Upload3DModelRequest:
      type: object
      properties:
        modelFile:
          type: string
          format: binary
          description: The 3D model file to upload
        modelName:
          type: string
          description: Name of the 3D model (optional)
        description:
          type: string
          description: Description of the 3D model (optional)
      required:
        - modelFile

    Upload3DModelResponse:
      type: object
      properties:
        modelId:
          type: string
          description: The ID of the uploaded 3D model
        status:
          type: string
          description: Status of the upload

    ModelListResponse:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/Model'
      required:
        - models

    Model:
      type: object
      properties:
        modelId:
          type: string
          description: The ID of the 3D model
        modelName:
          type: string
          description: Name of the 3D model
        uploadedAt:
          type: string
          format: date-time
          description: Upload date of the model
        description:
          type: string
          description: Description of the model

    ScheduleEventRequest:
      type: object
      properties:
        eventName:
          type: string
          description: Name of the event
        eventTime:
          type: string
          format: date-time
          description: Scheduled time for the event
        description:
          type: string
          description: Description of the event (optional)
        organizerId:
          type: string
          description: User ID of the event organizer
      required:
        - eventName
        - eventTime
        - organizerId

    ScheduleEventResponse:
      type: object
      properties:
        eventId:
          type: string
          description: The ID of the scheduled event
        status:
          type: string
          description: Status of the scheduling

    EventListResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
      required:
        - events

    Event:
      type: object
      properties:
        eventId:
          type: string
          description: The ID of the event
        eventName:
          type: string
          description: Name of the event
        eventTime:
          type: string
          format: date-time
          description: Scheduled time for the event
        description:
          type: string
          description: Description of the event
        organizerId:
          type: string
          description: User ID of the event organizer

    CustomizeAvatarRequest:
      type: object
      properties:
        userId:
          type: string
          description: The user's ID
        avatarSettings:
          type: object
          description: Settings for avatar customization
          properties:
            outfit:
              type: string
              description: Desired outfit for the avatar
            accessories:
              type: array
              items:
                type: string
              description: List of accessories to add
            appearance:
              type: object
              description: Physical appearance settings (e.g., hair color, skin tone)
      required:
        - userId
        - avatarSettings

    CustomizeAvatarResponse:
      type: object
      properties:
        avatarId:
          type: string
          description: The ID of the customized avatar
        status:
          type: string
          description: Status of the customization

    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          description: Application-specific error code
        message:
          type: string
          description: Error message explaining the issue
        details:
          type: object
          description: Additional details about the error (optional)

    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
        pageSize:
          type: integer
          description: Number of items per page
        totalPages:
          type: integer
          description: Total number of pages
        totalItems:
          type: integer
          description: Total number of items

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []