openapi: 3.1.0
info:
  title: Luci Digital IoT, Proton, and Hedera Integration
  description: |
    This API integrates Proton services, IoT devices managed via TheThingsIndustries, and Hedera's decentralized identity and payment systems into Luci Digital’s ecosystem. Lucia enables secure identity management, blockchain-based ownership validation, and IoT device automation.
  version: 2.0.0
servers:
  - url: https://api.lucidigital.com/v2
    description: Main Production Server for Luci Digital

paths:
  # Luci Digital Identity and Authentication
  /luci/identity/create:
    post:
      operationId: createLuciIdentity
      summary: Create a decentralized identity for Luci Digital users
      description: Creates a decentralized identity on Luci Digital’s infrastructure, using Hedera for blockchain storage and verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLuciIdentityRequest'
      responses:
        '201':
          description: Decentralized identity created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLuciIdentityResponse'

  /luci/identity/verify:
    post:
      operationId: verifyLuciIdentity
      summary: Verify a decentralized identity on Luci Digital
      description: Verifies a decentralized identity created on Luci Digital and stored on Hedera.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyLuciIdentityRequest'
      responses:
        '200':
          description: Identity verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyLuciIdentityResponse'

  # Luci Digital Alerts and Notifications
  /luci/alerts/subscribe:
    post:
      operationId: subscribeToLuciAlerts
      summary: Subscribe to real-time alerts in Luci Digital’s IoT, identity, and blockchain systems
      description: Subscribes to real-time alerts for IoT device status, identity verifications, or blockchain transaction events in Luci Digital.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeToLuciAlertsRequest'
      responses:
        '200':
          description: Subscribed to alerts successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscribeToLuciAlertsResponse'

  # Luci Digital IoT Device Management (Extended from TheThingsIndustries)
  /iot/luci/device/register:
    post:
      operationId: registerLuciIoTDevice
      summary: Register a new IoT device on Luci Digital
      description: Registers an IoT device in Luci Digital’s ecosystem using TheThingsIndustries, enabling decentralized identity and blockchain integration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterLuciDeviceRequest'
      responses:
        '201':
          description: Device registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterLuciDeviceResponse'

  /iot/luci/device/{deviceId}/status:
    get:
      operationId: getLuciIoTDeviceStatus
      summary: Get the status of an IoT device registered on Luci Digital
      description: Retrieves the status of an IoT device, including connectivity, last activity, and linked blockchain identity.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            description: Unique ID of the IoT device
      responses:
        '200':
          description: Device status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusResponse'

  /iot/luci/device/{deviceId}/control:
    post:
      operationId: controlLuciIoTDevice
      summary: Control an IoT device in Luci Digital’s ecosystem
      description: Sends commands to control an IoT device in Luci Digital’s ecosystem, tied to decentralized identity on Hedera.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            description: ID of the IoT device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlDeviceRequest'
      responses:
        '200':
          description: Command sent to IoT device successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlDeviceResponse'

  /iot/luci/device/{deviceId}/alerts:
    post:
      operationId: setLuciIoTAlerts
      summary: Set alerts for an IoT device
      description: Configure real-time alerts based on sensor data (e.g., temperature thresholds, battery levels) from a Luci Digital IoT device.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            description: ID of the IoT device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAlertRequest'
      responses:
        '200':
          description: Alert set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetAlertResponse'

  # Hedera Payments for IoT Services in Luci Digital
  /hedera/transactions/pay:
    post:
      operationId: payForIoTService
      summary: Make a payment for IoT services using Hedera
      description: Executes payments in HBAR for IoT services (e.g., data streaming, device access) via Hedera in Luci Digital’s ecosystem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayForIoTServiceRequest'
      responses:
        '200':
          description: Payment processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayForIoTServiceResponse'

components:
  schemas:
    # Luci Digital Identity Schemas
    CreateLuciIdentityRequest:
      type: object
      properties:
        userId:
          type: string
          description: User ID within Luci Digital
        publicKey:
          type: string
          description: Public key for identity creation
      required:
        - userId
        - publicKey

    CreateLuciIdentityResponse:
      type: object
      properties:
        identityId:
          type: string
          description: Decentralized identity ID generated by Luci Digital
        transactionId:
          type: string
          description: Hedera transaction ID where the identity is stored

    VerifyLuciIdentityRequest:
      type: object
      properties:
        identityId:
          type: string
          description: The decentralized identity ID to verify
        signature:
          type: string
          description: Signature of the identity to be verified
      required:
        - identityId
        - signature

    VerifyLuciIdentityResponse:
      type: object
      properties:
        isVerified:
          type: boolean
          description: Indicates if the identity is successfully verified

    # IoT and Control Schemas
    RegisterLuciDeviceRequest:
      type: object
      properties:
        deviceName:
          type: string
          description: Name of the IoT device
        deviceType:
          type: string
          description: Type of the IoT device (sensor, actuator, etc.)
        publicKey:
          type: string
          description: Public key for the device
      required:
        - deviceName
        - deviceType
        - publicKey

    RegisterLuciDeviceResponse:
      type: object
      properties:
        deviceId:
          type: string
          description: The unique ID of the registered IoT device

    DeviceStatusResponse:
      type: object
      properties:
        deviceName:
          type: string
          description: Name of the IoT device
        status:
          type: string
          description: Current status of the device (e.g., active, inactive)
        lastActive:
          type: string
          format: date-time
          description: Last known active time of the device

    ControlDeviceRequest:
      type: object
      properties:
        command:
          type: string
          description: Command to be sent to the device (e.g., "turn on", "turn off")
      required:
        - command

    ControlDeviceResponse:
      type: object
      properties:
        status:
          type: string
          description: Status of the control command sent to the device

    SetAlertRequest:
      type: object
      properties:
        alertType:
          type: string
          description: Type of alert (e.g., temperature threshold, battery          level, connectivity loss)
        thresholdValue:
          type: number
          description: The value at which the alert is triggered (e.g., temperature > 30°C)
      required:
        - alertType
        - thresholdValue

    SetAlertResponse:
      type: object
      properties:
        status:
          type: string
          description: Status of the alert setup (e.g., "success", "failure")

    # Hedera Payment Schemas
    PayForIoTServiceRequest:
      type: object
      properties:
        senderAccountId:
          type: string
          description: Hedera account ID of the sender
        receiverAccountId:
          type: string
          description: Hedera account ID of the receiver (e.g., IoT service provider)
        amount:
          type: number
          description: Amount of HBAR to be transferred for the IoT service
      required:
        - senderAccountId
        - receiverAccountId
        - amount

    PayForIoTServiceResponse:
      type: object
      properties:
        transactionId:
          type: string
          description: Hedera transaction ID for the payment
        status:
          type: string
          description: Status of the payment transaction (e.g., "completed", "pending")