openapi: 3.1.0
info:
  title: Lucia Digital API
  description: |
    This API integrates various components of the Lucia Digital platform, including Hedera for decentralized identity management, transactions, Nebula data processing, NFT 2.0, IoT, Metaverse interaction, and additional resources to enhance Lucia's capabilities.
  version: 1.0.0
servers:
  - url: https://api.luci-digital.com/v1
    description: Main Production Server
  - url: https://staging.luci-digital.com
    description: Staging Server

paths:
  /chat:
    post:
      operationId: chatInteraction
      summary: Handle user input via chat for AI interaction
      description: |
        This endpoint processes user input and interacts with Lucia's AI models to generate responses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: ID of the user interacting with Lucia
                message:
                  type: string
                  description: The user’s input message
                sessionId:
                  type: string
                  description: Optional session identifier for tracking conversation context
      responses:
        '200':
          description: AI response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: AI-generated response from Lucia
                  confidenceScore:
                    type: number
                    format: float
                    description: Confidence level of the AI response

  /hedera/identity/create:
    post:
      operationId: createUserWallet
      summary: Create a new Hedera account for decentralized identity
      description: |
        Generates a new Hedera account for a user in the Nebula system, managed by Lucia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The user's ID within Lucia’s system
                initialBalance:
                  type: number
                  description: Initial balance for the Hedera account (default: 0 HBAR)
                  example: 0
                accountName:
                  type: string
                  description: Optional name for the Hedera account
      responses:
        '201':
          description: Hedera Account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                    description: Generated Hedera account ID

  /hedera/identity/verify:
    post:
      operationId: verifyIdentity
      summary: Verify user identity using Hedera’s decentralized ledger
      description: |
        Validates the user’s identity credentials by querying the Hedera blockchain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: ID of the user to be verified
                idHash:
                  type: string
                  description: The hashed identity credentials
                verificationMethod:
                  type: string
                  description: The method used for verification (e.g., "email", "phone", "biometric")
      responses:
        '200':
          description: Identity verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  isVerified:
                    type: boolean
                    description: Verification status of the user
                  verificationTimestamp:
                    type: string
                    format: date-time
                    description: The timestamp when the verification was completed

  /hedera/transactions/send:
    post:
      operationId: sendPayment
      summary: Send HBAR payment between Hedera accounts
      description: |
        Executes a payment transaction between two Hedera accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                senderAccountId:
                  type: string
                  description: The Hedera account ID of the sender
                receiverAccountId:
                  type: string
                  description: The Hedera account ID of the receiver
                amount:
                  type: number
                  description: Amount of HBAR to be transferred
                  example: 10
                transactionMemo:
                  type: string
                  description: Optional memo for the transaction
      responses:
        '200':
          description: Payment transaction successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionStatus:
                    type: string
                    description: Status of the HBAR payment transaction
                  transactionId:
                    type: string
                    description: Unique ID for tracking the transaction

  /hedera/token/create:
    post:
      operationId: createToken
      summary: Create a custom token on the Hedera network
      description: |
        Mints a new token for use within the Nebula platform, allowing for token-based access control or transactions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tokenName:
                  type: string
                  description: The name of the token
                  example: LuciToken
                tokenSymbol:
                  type: string
                  description: The token’s symbol
                  example: LUC
                initialSupply:
                  type: number
                  description: Initial supply of the minted tokens
                  example: 1000
                tokenType:
                  type: string
                  description: Type of token (e.g., "fungible", "non-fungible")
      responses:
        '201':
          description: Token created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokenId:
                    type: string
                    description: The unique ID of the created token

  /iot/device/{deviceId}/status:
    get:
      operationId: getDeviceStatus
      summary: Retrieve IoT device status from Nebula
      description: |
        Queries the Nebula backend to retrieve the real-time status of an IoT device in Daryl's ecosystem.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the IoT device to query
      responses:
        '200':
          description: IoT device status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceName:
                    type: string
                    description: Name of the IoT device
                  status:
                    type: string
                    description: Current status of the device (e.g., "on", "off", "active")
                  lastChecked:
                    type: string
                    format: date-time
                    description: Last time the device status was checked

  /iot/device/control:
    post:
      operationId: controlDevice
      summary: Control an IoT device
      description: |
        Allows Lucia to send control commands to IoT devices connected to Nebula.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  description: ID of the IoT device to be controlled
                command:
                  type: string
                  description: Command to be executed (e.g., "turn on", "turn off")
                scheduledTime:
                  type: string
                  format: date-time
                  description: Optional scheduled time for executing the command
      responses:
        '200':
          description: Device control command sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the command was successful
                  executionStatus:
                    type: string
                    description: Status of command execution (e.g., "executed", "pending")

  /metaverse/space/create:
    post:
      operationId: create3DSpace
      summary: Create a new 3D space in the metaverse using Spatial.io
      description: |
        This endpoint sets up a 3D virtual environment for collaboration, meetings, or interactive experiences via Spatial.io.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spaceName:
                  type: string
                  description: The name of the 3D space to be created
                environmentType:
                  type: string
                  description: The type of environment (e.g., "virtual office", "workshop")
                avatarsEnabled:
                  type: boolean
                  description: Whether avatars are enabled in the space
                accessControl:
                  type: string
                  description: Access control level (e.g., "public", "private", "invite-only")
      responses:
        '201':
          description: 3D space created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  spaceId:
                    type: string
                    description: The unique ID of the created space

  /alerts/subscribe:
    post:
      operationId: subscribeToAlerts
      summary: Subscribe to system alerts
      description: |
        Subscribes to real-time alerts for important system events, such as transaction statuses, IoT device changes, and identity verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alertType:
                  type: string
                  description: The type of alert to subscribe to (e.g., "transaction", "identity", "device status")
                userId:
                  type: string
                  description: The ID of the user subscribing to alerts
      responses:
        '200':
          description: Subscribed to alerts successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptionId:
                    type: string
                    description: Unique ID for the subscription
                  success:
                    type: boolean
                    description: Whether the subscription was successful

  /alerts/event:
    post:
      operationId: triggerEventAlert
      summary: Trigger an alert for an event
      description: |
        Sends an alert notification to Daryl or other authorized users for events like completed transactions, IoT failures, or identity verification issues.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventType:
                  type: string
                  description: The type of event (e.g., "transactionCompleted", "iotFailure", "identityVerified")
                message:
                  type: string
                  description: Detailed message describing the event
                userId:
                  type: string
                  description: ID of the user or system associated with the event
                timestamp:
                  type: string
                  format: date-time
                  description: Timestamp of when the event occurred
      responses:
        '200':
          description: Event alert triggered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the event alert was successfully processed

  /nft/mint:
    post:
      operationId: mintNFT
      summary: Mint an NFT for content ownership
      description: |
        Mints a new NFT based on user-generated content or digital assets, allowing users to maintain ownership and control over their creations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The ID of the user minting the NFT
                contentUrl:
                  type: string
                  description: The URL of the digital content for which the NFT is being minted
                metadata:
                  type: object
                  description: Additional metadata associated with the NFT
                  properties:
                    title:
                      type: string
                      description: The title of the content
                    description:
                      type: string
                      description: Description of the content being minted as an NFT
                    attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          traitType:
                            type: string
                            description: The trait type (e.g., "color", "size")
                          value:
                            type: string
                            description: The value of the trait
      responses:
        '201':
          description: NFT minted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  nftId:
                    type: string
                    description: The unique ID of the minted NFT
                  tokenUrl:
                    type: string
                    description: The tokenized URL of the NFT on the blockchain

  /nft/transfer:
    post:
      operationId: transferNFT
      summary: Transfer ownership of an NFT
      description: |
        Transfers ownership of an NFT from one user to another.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nftId:
                  type: string
                  description: The unique ID of the NFT to be transferred
                fromUserId:
                  type: string
                  description: The current owner's user ID
                toUserId:
                  type: string
                  description: The recipient's user ID
                transactionMemo:
                  type: string
                  description: Optional memo for the transfer
      responses:
        '200':
          description: NFT transferred successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the NFT was transferred successfully
                  transactionId:
                    type: string
                    description: ID of the transaction for tracking

  /transaction/status:
    get:
      operationId: getTransactionStatus
      summary: Retrieve the status of a transaction
      description: |
        Queries the blockchain to retrieve the current status of a transaction, such as an HBAR payment or NFT transfer.
      parameters:
        - name: transactionId
          in: query
          required: true
          schema:
            type: string
            description: The ID of the transaction to query
      responses:
        '200':
          description: Transaction status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The current status of the transaction (e.g., "pending", "completed", "failed")
                  timestamp:
                    type: string
                    format: date-time
                    description: The timestamp of the transaction status check
                  blockNumber:
                    type: string
                    description: The block number in which the transaction was confirmed

  /user/profile:
    get:
      operationId: getUserProfile
      summary: Retrieve user profile information
      description: |
        Retrieves the profile information of a user within Lucia’s system.
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            description: The ID of the user
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    description: The user's ID
                  name:
                    type: string
                    description: The user's name
                  email:
                    type: string
                    description: The user's email address
                  createdAt:
                    type: string
                    format: date-time
                    description: The timestamp when the user profile was created

    put:
      operationId: updateUserProfile
      summary: Update user profile information
      description: |
        Updates the profile information of a user within Lucia’s system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The user's ID
                name:
                  type: string
                  description: The user's name
                email:
                  type: string
                  description: The user's email address
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the update was successful

  /user/delete:
    delete:
      operationId: deleteUserProfile
      summary: Delete a user profile
      description: |
        Deletes a user profile from Lucia’s system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The user's ID to be deleted
      responses:
        '200':
          description: User profile deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the deletion was successful

  /analytics/user-interactions:
    get:
      operationId: getUserInteractions
      summary: Retrieve user interaction analytics
      description: |
        Retrieves analytics data on user interactions with Lucia.
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
            description: The ID of the user (optional)
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
            description: Start date for the analytics data
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
            description: End date for the analytics data
      responses:
        '200':
          description: User interaction analytics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  interactions:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                          description: The user's ID
                        interactionType:
                          type: string
                          description: Type of interaction (e.g., "chat", "transaction")
                        timestamp:
                          type: string
                          format: date-time
                          description: When the interaction occurred

  /ai/model/train:
    post:
      operationId: trainAIModel
      summary: Train Lucia's AI models
      description: |
        Initiates training of Lucia's AI models using provided data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trainingDataUrl:
                  type: string
                  description: URL to the training data set
                parameters:
                  type: object
                  description: Parameters for model training
                  properties:
                    epochs:
                      type: integer
                      description: Number of training epochs
                    learningRate:
                      type: number
                      format: float
                      description: Learning rate for the training algorithm
      responses:
        '200':
          description: AI model training initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId:
                    type: string
                    description: ID of the training task
                  status:
                    type: string
                    description: Current status of the training task

  /ai/model/status:
    get:
      operationId: getAIModelTrainingStatus
      summary: Retrieve AI model training status
      description: |
        Retrieves the status of an AI model training task.
      parameters:
        - name: taskId
          in: query
          required: true
          schema:
            type: string
            description: ID of the training task
      responses:
        '200':
          description: AI model training status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId:
                    type: string
                    description: ID of the training task
                  status:
                    type: string
                    description: Current status (e.g., "pending", "in progress", "completed")
                  progress:
                    type: number
                    format: float
                    description: Training progress percentage

  /blockchain/cross-chain/transfer:
    post:
      operationId: crossChainTransfer
      summary: Execute cross-chain asset transfer
      description: |
        Transfers assets between Hedera and other supported blockchain networks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fromChain:
                  type: string
                  description: Source blockchain network (e.g., "Hedera", "Ethereum")
                toChain:
                  type: string
                  description: Destination blockchain network
                fromAccountId:
                  type: string
                  description: Source account ID
                toAccountId:
                  type: string
                  description: Destination account ID
                amount:
                  type: number
                  description: Amount to transfer
      responses:
        '200':
          description: Cross-chain transfer initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferId:
                    type: string
                    description: ID of the cross-chain transfer
                  status:
                    type: string
                    description: Current status of the transfer

  /auth/mfa/setup:
    post:
      operationId: setupMFA
      summary: Setup Multi-Factor Authentication
      description: |
        Enables multi-factor authentication for enhanced user security.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The user's ID
                mfaMethod:
                  type: string
                  description: The MFA method to setup (e.g., "email", "sms", "authenticatorApp")
      responses:
        '200':
          description: MFA setup initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfaSetupId:
                    type: string
                    description: ID for the MFA setup process
                  status:
                    type: string
                    description: Status of the MFA setup

  /auth/mfa/verify:
    post:
      operationId: verifyMFA
      summary: Verify Multi-Factor Authentication code
      description: |
        Verifies the MFA code provided by the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The user's ID
                mfaCode:
                  type: string
                  description: The MFA code entered by the user
      responses:
        '200':
          description: MFA verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  isVerified:
                    type: boolean
                    description: Whether the MFA verification was successful

  /smart-contracts/deploy:
    post:
      operationId: deploySmartContract
      summary: Deploy a smart contract on Hedera network
      description: |
        Deploys a new smart contract, allowing for more complex transaction handling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contractCode:
                  type: string
                  description: The code of the smart contract to be deployed
                parameters:
                  type: array
                  items:
                    type: string
                  description: Initialization parameters for the contract
      responses:
        '200':
          description: Smart contract deployed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  contractId:
                    type: string
                    description: ID of the deployed smart contract
                  transactionId:
                    type: string
                    description: ID of the deployment transaction

  /iot/device/data/{deviceId}:
    get:
      operationId: getDeviceData
      summary: Retrieve historical data from an IoT device
      description: |
        Retrieves historical data collected by an IoT device, enabling analytics and predictive maintenance.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            description: The ID of the IoT device
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
            description: Start date for data retrieval
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
            description: End date for data retrieval
      responses:
        '200':
          description: Device data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId:
                    type: string
                    description: The ID of the device
                  dataPoints:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: string
                          format: date-time
                          description: Time of the data point
                        value:
                          type: number
                          description: The data value collected

  /web3/dapps/integrate:
    post:
      operationId: integrateDApp
      summary: Integrate a decentralized application
      description: |
        Integrates a decentralized application (dApp) to enhance Lucia's functionality in the Web3 space.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dappName:
                  type: string
                  description: Name of the dApp to integrate
                dappUrl:
                  type: string
                  description: URL or endpoint of the dApp
                permissions:
                  type: array
                  items:
                    type: string
                  description: Permissions required by the dApp
      responses:
        '200':
          description: dApp integrated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  integrationId:
                    type: string
                    description: ID of the dApp integration
                  status:
                    type: string
                    description: Status of the integration

  /collaboration/tools/create:
    post:
      operationId: createCollaborationTool
      summary: Create a new collaboration tool in the metaverse space
      description: |
        Creates and manages collaborative tools within the metaverse space, such as whiteboards and document sharing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                toolType:
                  type: string
                  description: Type of collaboration tool (e.g., "whiteboard", "documentShare")
                spaceId:
                  type: string
                  description: ID of the metaverse space where the tool will be available
                settings:
                  type: object
                  description: Configuration settings for the tool
      responses:
        '201':
          description: Collaboration tool created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  toolId:
                    type: string
                    description: ID of the created tool

  /content/moderation:
    post:
      operationId: moderateContent
      summary: Moderate user-generated content
      description: |
        Ensures user-generated content adheres to community guidelines by integrating AI moderation tools.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contentId:
                  type: string
                  description: ID of the content to be moderated
                contentText:
                  type: string
                  description: The text of the content to be moderated
      responses:
        '200':
          description: Content moderated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  isApproved:
                    type: boolean
                    description: Whether the content passed moderation
                  reasons:
                    type: array
                    items:
                      type: string
                    description: Reasons for rejection if not approved

  /feedback/submit:
    post:
      operationId: submitFeedback
      summary: Submit user feedback on Lucia interactions
      description: |
        Allows users to provide feedback on their interactions with Lucia, which can be used to improve AI responses and overall user experience.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The user's ID
                feedbackText:
                  type: string
                  description: The feedback provided by the user
                interactionId:
                  type: string
                  description: ID of the interaction the feedback is about
      responses:
        '200':
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the feedback submission was successful

  /knowledge-base/query:
    post:
      operationId: queryKnowledgeBase
      summary: Query the knowledge base for information
      description: |
        Allows Lucia to query a knowledge base to provide accurate information to users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                queryText:
                  type: string
                  description: The query or question to search in the knowledge base
      responses:
        '200':
          description: Knowledge base query successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          description: Title of the knowledge base article
                        snippet:
                          type: string
                          description: A short excerpt of the article
                        url:
                          type: string
                          description: URL to the full article

  /ai/function-call:
    post:
      operationId: callFunction
      summary: Call external functions based on AI interpretation
      description: |
        Allows Lucia to interpret user input and call appropriate functions to perform tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The user's ID
                message:
                  type: string
                  description: The user's input message
      responses:
        '200':
          description: Function called successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  functionName:
                    type: string
                    description: The name of the function called
                  result:
                    type: string
                    description: Result returned by the function

  /audio/process:
    post:
      operationId: processAudio
      summary: Process audio input for speech recognition
      description: |
        Uses OpenAI's Whisper API to transcribe and understand audio inputs.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The user's ID
                audioFile:
                  type: string
                  format: binary
                  description: The audio file uploaded by the user
      responses:
        '200':
          description: Audio processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcription:
                    type: string
                    description: Transcribed text from the audio

  /integration/google-drive/upload:
    post:
      operationId: uploadToGoogleDrive
      summary: Upload files to Google Drive
      description: |
        Allows Lucia to upload files to the user's Google Drive account.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The user's ID
                accessToken:
                  type: string
                  description: OAuth2 access token for Google Drive
                file:
                  type: string
                  format: binary
                  description: The file to upload
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileId:
                    type: string
                    description: The ID of the uploaded file on Google Drive

  /vision/analyze-image:
    post:
      operationId: analyzeImage
      summary: Analyze an image using AI
      description: |
        Uses GPT-4 Vision capabilities to analyze and describe images.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The user's ID
                imageFile:
                  type: string
                  format: binary
                  description: The image file uploaded by the user
      responses:
        '200':
          description: Image analyzed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  description:
                    type: string
                    description: AI-generated description of the image
                  tags:
                    type: array
                    items:
                      type: string
                    description: Tags associated with the image content

  /batch/process:
    post:
      operationId: batchProcess
      summary: Process batch requests
      description: |
        Allows for batch processing of multiple requests simultaneously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tasks:
                  type: array
                  items:
                    type: object
                    properties:
                      taskType:
                        type: string
                        description: The type of task (e.g., "transcription", "imageAnalysis")
                      data:
                        type: object
                        description: Data required for the task
      responses:
        '200':
          description: Batch processing initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchId:
                    type: string
                    description: ID of the batch process
                  status:
                    type: string
                    description: Current status of the batch process

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []